---
- name: Provision EC2 Server with Docker, K3s, and Jenkins
  hosts: ec2_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # 1. Install Docker
    - name: Install dependencies for Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Install Docker CE
      apt:
        name: docker-ce
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add standard user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # 2. Install K3s (Lightweight Kubernetes)
    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s node to be ready
      command: k3s kubectl get node
      register: k3s_status
      until: k3s_status.rc == 0
      retries: 5
      delay: 10

    - name: Change permissions on K3s kubeconfig for standard user
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: '0644'

    # 3. Install Jenkins
    - name: Install Java (required for Jenkins)
      apt:
        name: openjdk-17-jre-headless
        state: present

    - name: Add Jenkins GPG key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Add Jenkins Repository
      apt_repository:
        repo: deb https://pkg.jenkins.io/debian-stable binary/
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Ensure Jenkins service is running
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins to apply docker group
      systemd:
        name: jenkins
        state: restarted
