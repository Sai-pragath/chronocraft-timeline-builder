---
# ==========================================
# PLAY 1: Provision Jenkins CI/CD Node
# ==========================================
- name: Provision Jenkins CI/CD Server
  hosts: jenkins_server
  become: yes

  vars:
    docker_keyring: /etc/apt/keyrings/docker.asc
    jenkins_keyring: /etc/apt/keyrings/jenkins.gpg

  tasks:

    ####################################################################
    # Update APT
    ####################################################################

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    ####################################################################
    # Install Common Packages
    ####################################################################

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    ####################################################################
    # Install Docker
    ####################################################################

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_keyring }}"
        mode: "0644"

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by={{ docker_keyring }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    ####################################################################
    # Install Java
    ####################################################################

    - name: Install Java 21
      apt:
        name: openjdk-21-jre-headless
        state: present

    ####################################################################
    # Install Jenkins
    ####################################################################

    - name: Remove old Jenkins repository
      file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Remove old Jenkins key
      file:
        path: "{{ jenkins_keyring }}"
        state: absent

    - name: Download Jenkins GPG key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key \
        | gpg --dearmor -o {{ jenkins_keyring }}
      args:
        creates: "{{ jenkins_keyring }}"

    - name: Add Jenkins Repository
      apt_repository:
        repo: "deb [signed-by={{ jenkins_keyring }}] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Enable Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted

# ==========================================
# PLAY 2: Provision K3s Master Node
# ==========================================
- name: Provision Kubernetes Master Node
  hosts: k3s_master
  become: yes
  tasks:
    - name: Install K3s Server
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san {{ inventory_hostname }} --node-external-ip {{ inventory_hostname }}" sh -

    - name: Wait for K3s node to be ready
      command: k3s kubectl get node
      register: k3s_status
      until: k3s_status.rc == 0
      retries: 5
      delay: 10

    - name: Change permissions on K3s kubeconfig for standard user
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: '0644'

    - name: Retrieve K3s node token for workers
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64

    - name: Set k3s token as a fact
      set_fact:
        k3s_token: "{{ node_token_b64['content'] | b64decode | trim }}"

# ==========================================
# PLAY 3: Provision K3s Worker Nodes
# ==========================================
- name: Provision Kubernetes Worker Nodes
  hosts: k3s_workers
  become: yes
  tasks:
    - name: Install K3s Agent (Worker)
      shell: >
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ groups['k3s_master'][0] }}:6443 K3S_TOKEN={{ hostvars[groups['k3s_master'][0]]['k3s_token'] }} sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
