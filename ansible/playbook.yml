---
- name: Provision EC2 Server with Docker, K3s, and Jenkins
  hosts: ec2_servers
  become: yes

  vars:
    docker_keyring: /etc/apt/keyrings/docker.asc
    jenkins_keyring: /etc/apt/keyrings/jenkins.gpg

  tasks:

    ####################################################################
    # Update APT
    ####################################################################

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    ####################################################################
    # Install Common Packages
    ####################################################################

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    ####################################################################
    # Install Docker
    ####################################################################

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_keyring }}"
        mode: "0644"

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by={{ docker_keyring }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    ####################################################################
    # Install K3s
    ####################################################################

    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait until K3s is ready
      command: k3s kubectl get nodes
      register: k3s_status
      retries: 10
      delay: 10
      until: k3s_status.rc == 0
      changed_when: false

    - name: Set kubeconfig permissions
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    ####################################################################
    # Install Java
    ####################################################################

    - name: Install Java 21
      apt:
        name: openjdk-21-jre-headless
        state: present

    ####################################################################
    # Install Jenkins
    ####################################################################

    - name: Remove old Jenkins repository
      file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Remove old Jenkins key
      file:
        path: "{{ jenkins_keyring }}"
        state: absent

    - name: Download Jenkins GPG key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key \
        | gpg --dearmor -o {{ jenkins_keyring }}
      args:
        creates: "{{ jenkins_keyring }}"

    - name: Add Jenkins Repository
      apt_repository:
        repo: "deb [signed-by={{ jenkins_keyring }}] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Enable Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted

    ####################################################################
    # Verify Installations
    ####################################################################

    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify K3s
      command: k3s --version
      register: k3s_version
      changed_when: false

    - name: Verify Jenkins
      command: java -jar /usr/share/java/jenkins.war --version
      register: jenkins_version
      changed_when: false
      ignore_errors: yes

    - name: Display Versions
      debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ k3s_version.stdout }}"
          - "{{ jenkins_version.stdout | default('Jenkins Installed Successfully') }}"
