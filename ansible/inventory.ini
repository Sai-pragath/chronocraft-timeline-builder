[jenkins_server]
# Replace <JENKINS-IP> with your CI/CD server public IP
<JENKINS-IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/Downloads/webapp.pem

[k3s_master]
# Replace <MASTER-IP> with your Kubernetes Master server public IP
<MASTER-IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/Downloads/webapp.pem

[k3s_workers]
# Replace <WORKER-IP> with your Kubernetes Worker server public IP
# You can add multiple workers by listing them on new lines
<WORKER-IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/Downloads/webapp.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
