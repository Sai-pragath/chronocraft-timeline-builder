apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronocraft-frontend
  labels:
    app: chronocraft
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chronocraft
      tier: frontend
  template:
    metadata:
      labels:
        app: chronocraft
        tier: frontend
    spec:
      containers:
      - name: frontend
        # Note: Replace with your actual registry in Jenkinsfile
        image: chronocraft-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: chronocraft-frontend
  labels:
    app: chronocraft
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: chronocraft
    tier: frontend
